    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('pf-theme') || '"aurora"');
          document.documentElement.dataset.theme = t;
          var fx = JSON.parse(localStorage.getItem('pf-fx') || 'null');
          if (fx === null) fx = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          document.documentElement.dataset.fx = fx ? 'on' : 'off';
          var saved = localStorage.getItem('theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
